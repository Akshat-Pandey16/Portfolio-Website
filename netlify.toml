# Netlify config. The deploy broke because the package manager changed: the old
# pnpm-lock.yaml is gone and there's now a bun.lock — Netlify picks the manager
# from the lockfile, so it needs to build with Bun. This pins that explicitly.
[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Netlify ships Bun; pin a recent one so installs use the bun.lock
  BUN_VERSION = "1.3.14"
  NODE_VERSION = "22"

# SPA fallback (harmless even with no client router); real static files
# (og.png, the résumé PDF, /assets, /fonts) are served before this applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
