<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Papyrus — self-hostable PDF toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14140d"/>
      <stop offset="0.55" stop-color="#0e0e0a"/>
      <stop offset="1" stop-color="#090907"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320 180) rotate(130) scale(640)">
      <stop offset="0" stop-color="#dcd84f" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#dcd84f" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#dcd84f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="560" y1="300" x2="940" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbf6"/>
      <stop offset="1" stop-color="#e7e7dc"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- stacked PDF pages -->
  <g transform="translate(520 250) rotate(-7)">
    <rect x="44" y="40" width="360" height="470" rx="22" fill="#cfcfc4" opacity="0.35"/>
    <rect x="24" y="22" width="360" height="470" rx="22" fill="#deded2" opacity="0.6"/>
    <!-- top page with folded corner -->
    <path d="M0 22 a22 22 0 0 1 22-22 H300 L384 84 V470 a22 22 0 0 1-22 22 H22 a22 22 0 0 1-22-22 Z" fill="url(#page)"/>
    <path d="M300 0 L384 84 H322 a22 22 0 0 1-22-22 Z" fill="#c8c8bb"/>
    <!-- text lines -->
    <rect x="46" y="118" width="210" height="16" rx="8" fill="#b9b9ab"/>
    <rect x="46" y="158" width="292" height="12" rx="6" fill="#cdcdc0"/>
    <rect x="46" y="188" width="292" height="12" rx="6" fill="#cdcdc0"/>
    <rect x="46" y="218" width="232" height="12" rx="6" fill="#cdcdc0"/>
    <rect x="46" y="266" width="292" height="12" rx="6" fill="#d6d6c9"/>
    <rect x="46" y="296" width="262" height="12" rx="6" fill="#d6d6c9"/>
    <!-- accent PDF tag -->
    <rect x="46" y="372" width="120" height="48" rx="12" fill="#dcd84f"/>
    <text x="106" y="404" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#1a1a0e" text-anchor="middle">PDF</text>
  </g>

  <!-- wordmark + copy -->
  <g transform="translate(980 0)">
    <text x="0" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="118" font-weight="800" letter-spacing="-3" fill="#f6f6ef">Papyrus<tspan fill="#dcd84f">.</tspan></text>
    <text x="4" y="470" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="500" fill="#b9b9ab">Self-hostable PDF toolkit</text>
    <text x="4" y="524" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="400" fill="#8a8a7e">merge · split · compress · OCR</text>

    <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="24" font-weight="600">
      <g transform="translate(4 600)">
        <rect x="0" y="0" width="158" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="79" y="34" fill="#cfcfc4" text-anchor="middle">FastAPI</text>
      </g>
      <g transform="translate(178 600)">
        <rect x="0" y="0" width="158" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="79" y="34" fill="#cfcfc4" text-anchor="middle">Celery</text>
      </g>
      <g transform="translate(352 600)">
        <rect x="0" y="0" width="138" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="69" y="34" fill="#cfcfc4" text-anchor="middle">React</text>
      </g>
    </g>
  </g>

  <text x="64" y="936" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="22" letter-spacing="4" fill="#6f6f64">2026 · OPEN SOURCE · ZERO-RETENTION</text>
</svg>
