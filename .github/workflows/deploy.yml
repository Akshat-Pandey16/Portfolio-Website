name: Deploy to Cloudflare Pages

# Auto-deploy on push WITHOUT the Cloudflare GitHub App — uses an API token
# instead, so it works even when the Git integration won't install.
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare dashboard → My Profile → API Tokens →
#                           Create Token → "Edit Cloudflare Workers"/Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard → Workers & Pages (right sidebar)
# Also create the Pages project once named "akshat-pandey" (or run
# `bun run deploy` locally the first time, which creates it).

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=akshat-pandey --branch=main
